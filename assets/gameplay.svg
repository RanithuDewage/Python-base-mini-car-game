<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 280" width="100%" height="280" style="background:#0f172a; border-radius:12px; font-family:'Segoe UI', system-ui, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cardGlow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @keyframes keyPulse {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    .key-btn {
      animation: keyPulse 2s ease-in-out infinite;
    }
    @keyframes barAnim {
      0% { width: 140px; fill: #22c55e; }
      50% { width: 60px; fill: #eab308; }
      80% { width: 25px; fill: #ef4444; }
      100% { width: 140px; fill: #22c55e; }
    }
    .fuel-bar-fill {
      animation: barAnim 5s ease-in-out infinite;
    }
  </style>

  <!-- Title Bar -->
  <text x="30" y="38" fill="#f8fafc" font-size="18" font-weight="800" letter-spacing="0.5">🎮 Core Gameplay &amp; Mechanics</text>
  <line x1="30" y1="52" x2="820" y2="52" stroke="#334155" stroke-width="1"/>

  <!-- Card 1: Controls -->
  <g transform="translate(30, 70)">
    <rect width="240" height="180" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardGlow)"/>
    <text x="20" y="32" fill="#38bdf8" font-size="14" font-weight="700">🕹️ CONTROLS</text>

    <!-- Steering -->
    <g transform="translate(20, 50)" class="key-btn">
      <rect width="32" height="26" rx="5" fill="#334155" stroke="#64748b"/>
      <text x="16" y="18" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">W</text>
    </g>
    <g transform="translate(56, 50)" class="key-btn">
      <rect width="32" height="26" rx="5" fill="#334155" stroke="#64748b"/>
      <text x="16" y="18" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">A</text>
    </g>
    <g transform="translate(92, 50)" class="key-btn">
      <rect width="32" height="26" rx="5" fill="#334155" stroke="#64748b"/>
      <text x="16" y="18" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">S</text>
    </g>
    <g transform="translate(128, 50)" class="key-btn">
      <rect width="32" height="26" rx="5" fill="#334155" stroke="#64748b"/>
      <text x="16" y="18" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">D</text>
    </g>
    <text x="168" y="68" fill="#94a3b8" font-size="12">Steer &amp; Move</text>

    <!-- Space jump -->
    <g transform="translate(20, 92)" class="key-btn">
      <rect width="90" height="26" rx="5" fill="#0284c7" stroke="#38bdf8"/>
      <text x="45" y="18" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">SPACEBAR</text>
    </g>
    <text x="120" y="110" fill="#94a3b8" font-size="12">Jump Obstacles</text>

    <!-- Restart -->
    <g transform="translate(20, 132)" class="key-btn">
      <rect width="32" height="26" rx="5" fill="#334155" stroke="#64748b"/>
      <text x="16" y="18" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">R</text>
    </g>
    <text x="62" y="150" fill="#94a3b8" font-size="12">Restart when crashed</text>
  </g>

  <!-- Card 2: Obstacles & Hazard Matrix -->
  <g transform="translate(305, 70)">
    <rect width="240" height="180" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardGlow)"/>
    <text x="20" y="32" fill="#f43f5e" font-size="14" font-weight="700">⚠️ TRAFFIC HAZARDS</text>

    <!-- Car hazard -->
    <circle cx="32" cy="62" r="10" fill="#ef4444"/>
    <text x="52" y="66" fill="#f1f5f9" font-size="12" font-weight="600">Rival Cars</text>
    <text x="130" y="66" fill="#94a3b8" font-size="11">High speed rush</text>

    <!-- Heavy truck -->
    <circle cx="32" cy="102" r="10" fill="#f59e0b"/>
    <text x="52" y="106" fill="#f1f5f9" font-size="12" font-weight="600">Heavy Trucks</text>
    <text x="140" y="106" fill="#94a3b8" font-size="11">Large width body</text>

    <!-- Concrete block -->
    <circle cx="32" cy="142" r="10" fill="#64748b"/>
    <text x="52" y="146" fill="#f1f5f9" font-size="12" font-weight="600">Road Blocks</text>
    <text x="140" y="146" fill="#94a3b8" font-size="11">Static road debris</text>
  </g>

  <!-- Card 3: Survival Economy & HUD -->
  <g transform="translate(580, 70)">
    <rect width="240" height="180" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardGlow)"/>
    <text x="20" y="32" fill="#22c55e" font-size="14" font-weight="700">⛽ SURVIVAL &amp; LOOT</text>

    <!-- Fuel bar visualization -->
    <text x="20" y="64" fill="#94a3b8" font-size="11">Fuel Depletion Meter:</text>
    <rect x="20" y="74" width="160" height="12" rx="3" fill="#1e293b" stroke="#475569"/>
    <rect x="20" y="74" class="fuel-bar-fill" height="12" rx="3"/>

    <!-- Collectibles info -->
    <g transform="translate(20, 108)">
      <circle cx="8" cy="8" r="8" fill="#eab308"/>
      <text x="24" y="12" fill="#f1f5f9" font-size="12" font-weight="600">Gold Coins:</text>
      <text x="96" y="12" fill="#38bdf8" font-size="11">+150 Distance pts</text>
    </g>

    <g transform="translate(20, 140)">
      <rect x="0" y="0" width="16" height="16" rx="3" fill="#22c55e"/>
      <text x="24" y="12" fill="#f1f5f9" font-size="12" font-weight="600">Fuel Jerrycans:</text>
      <text x="114" y="12" fill="#4ade80" font-size="11">+25% Refill</text>
    </g>
  </g>
</svg>
