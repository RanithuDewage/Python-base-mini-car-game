<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" height="360" style="background:#0d1117; border-radius:14px; overflow:hidden; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="60%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="100%" stop-color="#181a20"/>
    </linearGradient>

    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="redCar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="truckBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <linearGradient id="neonGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="headlightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Animated Road Dashes */
    @keyframes moveRoad {
      0% { transform: translateY(-70px); }
      100% { transform: translateY(70px); }
    }
    .road-line {
      animation: moveRoad 0.75s linear infinite;
    }

    /* Player Car Hover / Vibration */
    @keyframes carVibe {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      25% { transform: translateY(-2px) rotate(0.4deg); }
      75% { transform: translateY(2px) rotate(-0.4deg); }
    }
    .player-car {
      animation: carVibe 0.4s ease-in-out infinite;
    }

    /* Headlights Pulsing */
    @keyframes pulseLights {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.6; }
    }
    .headlight-beam {
      animation: pulseLights 0.8s ease-in-out infinite;
    }

    /* Floating Coin Spin */
    @keyframes coinSpin {
      0% { transform: scaleX(1) translateY(0); }
      25% { transform: scaleX(0.2) translateY(-4px); }
      50% { transform: scaleX(1) translateY(0); }
      75% { transform: scaleX(0.2) translateY(4px); }
      100% { transform: scaleX(1) translateY(0); }
    }
    .coin-icon {
      transform-origin: 510px 180px;
      animation: coinSpin 1.6s ease-in-out infinite;
    }

    /* Fuel Canister Glow */
    @keyframes fuelPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px rgba(34,197,94,0.6)); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 10px rgba(34,197,94,0.9)); }
    }
    .fuel-icon {
      transform-origin: 390px 100px;
      animation: fuelPulse 1.8s ease-in-out infinite;
    }

    /* Opponent Car Flow */
    @keyframes trafficMove {
      0% { transform: translateY(-40px); }
      100% { transform: translateY(220px); }
    }
    .traffic-car {
      animation: trafficMove 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Badge & Text Glow */
    @keyframes textGlow {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(56,189,248,0.3)); }
      50% { filter: drop-shadow(0 0 25px rgba(129,140,248,0.6)); }
    }
    .title-banner {
      animation: textGlow 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="360" fill="url(#skyGrad)"/>

  <!-- Starry Grid Decor -->
  <g opacity="0.12">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#60a5fa" stroke-width="0.8"/>
    </pattern>
    <rect width="900" height="360" fill="url(#grid)"/>
  </g>

  <!-- Right Perspective Mini Arcade Road Simulation -->
  <g transform="translate(180, 0)">
    <!-- Road Track -->
    <rect x="230" y="0" width="240" height="360" fill="url(#roadGrad)"/>
    <!-- Grass Borders -->
    <rect x="222" y="0" width="8" height="360" fill="#22c55e" opacity="0.85"/>
    <rect x="470" y="0" width="8" height="360" fill="#22c55e" opacity="0.85"/>
    <!-- Road Edges -->
    <line x1="230" y1="0" x2="230" y2="360" stroke="#475569" stroke-width="3"/>
    <line x1="470" y1="0" x2="470" y2="360" stroke="#475569" stroke-width="3"/>

    <!-- Animated Lane Dashed Lines -->
    <g class="road-line">
      <!-- Lane 1 (x=310) -->
      <line x1="310" y1="-80" x2="310" y2="-40" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="310" y1="-10" x2="310" y2="30" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="310" y1="60" x2="310" y2="100" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="310" y1="130" x2="310" y2="170" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="310" y1="200" x2="310" y2="240" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="310" y1="270" x2="310" y2="310" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="310" y1="340" x2="310" y2="380" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="310" y1="410" x2="310" y2="450" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>

      <!-- Lane 2 (x=390) -->
      <line x1="390" y1="-80" x2="390" y2="-40" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="390" y1="-10" x2="390" y2="30" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="390" y1="60" x2="390" y2="100" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="390" y1="130" x2="390" y2="170" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="390" y1="200" x2="390" y2="240" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="390" y1="270" x2="390" y2="310" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="390" y1="340" x2="390" y2="380" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
      <line x1="390" y1="410" x2="390" y2="450" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Traffic Obstacle (Red Car) -->
    <g class="traffic-car">
      <g transform="translate(252, 20)">
        <!-- Wheels -->
        <rect x="0" y="8" width="6" height="12" rx="2" fill="#0f172a"/>
        <rect x="34" y="8" width="6" height="12" rx="2" fill="#0f172a"/>
        <rect x="0" y="32" width="6" height="12" rx="2" fill="#0f172a"/>
        <rect x="34" y="32" width="6" height="12" rx="2" fill="#0f172a"/>
        <!-- Body -->
        <rect x="4" y="2" width="32" height="48" rx="6" fill="url(#redCar)"/>
        <!-- Windshield -->
        <rect x="8" y="14" width="24" height="10" rx="3" fill="#1e293b"/>
        <!-- Rear lights -->
        <circle cx="9" cy="46" r="2.5" fill="#fca5a5"/>
        <circle cx="31" cy="46" r="2.5" fill="#fca5a5"/>
      </g>
    </g>

    <!-- Collectible Item: Fuel Can -->
    <g class="fuel-icon" transform="translate(330, 90)">
      <rect x="0" y="4" width="20" height="24" rx="4" fill="#22c55e" stroke="#15803d" stroke-width="1.5"/>
      <rect x="6" y="0" width="8" height="5" rx="1.5" fill="#ef4444"/>
      <!-- Cross mark -->
      <line x1="10" y1="10" x2="10" y2="22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="4" y1="16" x2="16" y2="16" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Collectible Item: Coin -->
    <g class="coin-icon">
      <circle cx="510" cy="180" r="14" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
      <circle cx="510" cy="180" r="10" fill="none" stroke="#fef08a" stroke-width="1.5"/>
      <text x="510" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#713f12" font-family="monospace">★</text>
    </g>

    <!-- Player Car (Blue Racer with jump shadow) -->
    <!-- Car shadow -->
    <ellipse cx="350" cy="295" rx="24" ry="7" fill="#000000" opacity="0.6"/>

    <g class="player-car" transform="translate(328, 220)">
      <!-- Headlight Beams -->
      <g class="headlight-beam" filter="url(#headlightGlow)">
        <polygon points="8,0 -20,-110 30,-110 14,0" fill="#38bdf8" opacity="0.18"/>
        <polygon points="30,0 14,-110 64,-110 36,0" fill="#38bdf8" opacity="0.18"/>
      </g>

      <!-- Wheels -->
      <rect x="0" y="14" width="7" height="15" rx="2" fill="#0f172a"/>
      <rect x="37" y="14" width="7" height="15" rx="2" fill="#0f172a"/>
      <rect x="0" y="46" width="7" height="15" rx="2" fill="#0f172a"/>
      <rect x="37" y="46" width="7" height="15" rx="2" fill="#0f172a"/>

      <!-- Body -->
      <rect x="5" y="4" width="34" height="64" rx="7" fill="url(#carBody)" stroke="#38bdf8" stroke-width="1"/>
      <!-- Roof & Cockpit -->
      <rect x="9" y="16" width="26" height="26" rx="5" fill="#0f172a"/>
      <rect x="12" y="19" width="20" height="10" rx="3" fill="#7dd3fc" opacity="0.85"/>
      <rect x="12" y="32" width="20" height="7" rx="2" fill="#0284c7" opacity="0.6"/>

      <!-- Front Lights -->
      <rect x="8" y="2" width="8" height="4" rx="1.5" fill="#fef08a" filter="url(#glow)"/>
      <rect x="28" y="2" width="8" height="4" rx="1.5" fill="#fef08a" filter="url(#glow)"/>

      <!-- Rear Spoiler -->
      <rect x="7" y="64" width="30" height="4" rx="2" fill="#0369a1"/>
    </g>
  </g>

  <!-- Left Header Content & Branding -->
  <g transform="translate(48, 50)">
    <!-- Pill Badge -->
    <g transform="translate(0, 0)">
      <rect width="180" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="5" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="18" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">PYTHON • PYGAME</text>
    </g>

    <!-- Main Title -->
    <g class="title-banner" transform="translate(0, 72)">
      <text x="0" y="0" font-size="44" font-weight="900" fill="url(#neonGlow)" letter-spacing="-0.5">
        NoCtraX
      </text>
      <text x="185" y="0" font-size="44" font-weight="900" fill="#f8fafc" letter-spacing="-0.5">
        Survival
      </text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="104" font-size="16" fill="#94a3b8" font-weight="500">
      High-octane endless vehicle survival arcade game.
    </text>

    <!-- Feature tags -->
    <g transform="translate(0, 134)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="105" height="26" rx="6" fill="#1e293b"/>
      <text x="10" y="17" fill="#cbd5e1" font-size="11" font-weight="600">🚗 Jump Physics</text>

      <!-- Tag 2 -->
      <rect x="115" y="0" width="112" height="26" rx="6" fill="#1e293b"/>
      <text x="125" y="17" fill="#cbd5e1" font-size="11" font-weight="600">⚡ Dynamic Speed</text>

      <!-- Tag 3 -->
      <rect x="237" y="0" width="100" height="26" rx="6" fill="#1e293b"/>
      <text x="247" y="17" fill="#cbd5e1" font-size="11" font-weight="600">⛽ Fuel Survival</text>
    </g>

    <!-- Quick Run Snippet Box -->
    <g transform="translate(0, 185)">
      <rect width="338" height="52" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="14" y="24" fill="#64748b" font-size="11" font-family="monospace">Quick Start:</text>
      <text x="14" y="42" fill="#38bdf8" font-size="13" font-weight="600" font-family="monospace">pip install pygame &amp;&amp; python Game.py</text>
    </g>
  </g>
</svg>
